<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>艾宾浩斯复习日历</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="应用概览">
        <div>
          <p class="eyebrow">Ebbinghaus Review</p>
          <h1 id="appTitle">艾宾浩斯复习日历</h1>
        </div>
        <label class="language-control">
          <span id="languageLabel">语言</span>
          <select id="languageSelect">
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>
        <div class="stats" aria-label="复习统计">
          <div>
            <span id="todayCount">0</span>
            <small id="todayCountLabel">今日待复习</small>
          </div>
          <div>
            <span id="totalCount">0</span>
            <small id="totalCountLabel">知识条目</small>
          </div>
          <div>
            <span id="doneCount">0</span>
            <small id="doneCountLabel">已完成节点</small>
          </div>
        </div>
      </section>

      <section class="auth-panel" aria-label="账号与同步">
        <div>
          <p class="eyebrow" id="syncMode">Local Mode</p>
          <h2 id="authTitle">本地保存</h2>
          <p id="authDescription">当前内容保存在这个浏览器里。配置 Supabase 后，可以登录并同步不同设备的数据。</p>
        </div>
        <form id="authForm" class="auth-form hidden">
          <input id="authEmail" type="email" placeholder="邮箱" autocomplete="email" />
          <input id="authPassword" type="password" placeholder="密码，至少 6 位" autocomplete="current-password" />
          <button class="primary-button" id="signInButton" type="button">登录</button>
          <button class="secondary-button" id="signUpButton" type="button">注册</button>
        </form>
        <div class="account-actions hidden" id="accountActions">
          <span id="accountEmail"></span>
          <button class="secondary-button" id="signOutButton" type="button">退出登录</button>
        </div>
      </section>

      <nav class="app-nav" aria-label="主导航">
        <button class="nav-button active" type="button" data-page-target="calendar">日历</button>
        <button class="nav-button" type="button" data-page-target="reviews">复习</button>
        <button class="nav-button" type="button" data-page-target="entry">记录</button>
        <button class="nav-button" type="button" data-page-target="library">知识库</button>
      </nav>

      <section class="page active" data-page="calendar">
        <section class="calendar-panel" aria-label="复习日历">
          <div class="calendar-toolbar">
            <button class="icon-button" id="prevMonth" type="button" aria-label="上个月">‹</button>
            <h2 id="monthTitle"></h2>
            <button class="icon-button" id="nextMonth" type="button" aria-label="下个月">›</button>
          </div>
          <div class="weekday-row" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>
      </section>

      <section class="page" data-page="reviews">
        <section class="review-board" aria-label="每日复习详情">
          <div class="board-header">
            <div>
              <p class="eyebrow">Selected Day</p>
              <h2 id="selectedDateTitle">今日复习</h2>
            </div>
            <div class="header-actions">
              <button class="secondary-button" id="jumpToday" type="button">回到今天</button>
              <button class="primary-button" id="goEntryFromReviews" type="button">记录新知识</button>
            </div>
          </div>
          <div id="reviewList" class="review-list"></div>
        </section>
      </section>

      <section class="page" data-page="entry">
        <aside class="entry-panel" aria-label="添加知识">
          <div class="panel-heading">
            <p class="eyebrow hidden" id="editModeLabel">Edit Mode</p>
            <h2 id="entryTitle">记录学习内容</h2>
            <p id="entryDescription">输入学习日期、类别和知识点，系统会自动生成复习节点。</p>
          </div>

          <form id="memoryForm" class="memory-form">
            <label>
              <span id="learnDateLabel">学习日期</span>
              <input id="learnDate" name="learnDate" type="date" required />
            </label>
            <label>
              <span id="categoryLabel">类别</span>
              <input id="category" name="category" type="text" placeholder="例如：英语、数学、产品设计" required />
            </label>
            <label>
              <span id="topicLabel">知识点</span>
              <input id="topic" name="topic" type="text" placeholder="例如：过去完成时、导数定义" required />
            </label>
            <label>
              <span id="noteLabel">备注</span>
              <textarea id="note" name="note" rows="4" placeholder="可写关键词、链接、例题编号等"></textarea>
            </label>
            <div class="form-actions">
              <button class="primary-button" id="submitMemoryButton" type="submit">添加到复习计划</button>
              <button class="secondary-button hidden" id="cancelEditButton" type="button">取消编辑</button>
            </div>
          </form>

          <div class="rule-box">
            <h3 id="intervalTitle">默认复习间隔</h3>
            <div class="intervals" id="intervalList"></div>
          </div>
        </aside>
      </section>

      <section class="page" data-page="library">
        <section class="library" aria-label="知识库">
          <div class="board-header">
            <div>
              <p class="eyebrow">Knowledge Base</p>
              <h2 id="libraryTitle">全部知识</h2>
            </div>
            <button class="danger-button" id="clearAll" type="button">清空数据</button>
          </div>

          <div class="library-tools" aria-label="知识库筛选">
            <label>
              <span id="searchLabel">搜索</span>
              <input id="librarySearch" type="search" placeholder="搜索类别、知识点或备注" />
            </label>
            <label>
              <span id="filterLabel">分类</span>
              <select id="categoryFilter">
                <option value="">全部分类</option>
              </select>
            </label>
            <label>
              <span id="sortLabel">排序</span>
              <select id="sortMode">
                <option value="newest">最新记录</option>
                <option value="learnDateDesc">学习日期近到远</option>
                <option value="learnDateAsc">学习日期远到近</option>
                <option value="category">按分类</option>
              </select>
            </label>
          </div>

          <div class="library-summary">
            <span id="librarySummary">共 0 条</span>
            <span id="libraryPageInfo">第 1 页</span>
          </div>

          <div id="memoryList" class="memory-list"></div>

          <div class="pagination" aria-label="知识库分页">
            <button class="secondary-button" id="prevLibraryPage" type="button">上一页</button>
            <button class="secondary-button" id="nextLibraryPage" type="button">下一页</button>
          </div>
        </section>
      </section>
    </main>

    <template id="emptyTemplate">
      <div class="empty-state">
        <strong>这一天没有复习任务</strong>
        <span>可以选择其他日期，或添加新的知识点。</span>
      </div>
    </template>

    <script src="./supabase-config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
